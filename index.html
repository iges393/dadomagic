<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador Dado Mágico</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:active { background: #0056b3; }
        #estado { font-size: 20px; margin-top: 20px; color: #aaa; }
        #resultado { font-size: 100px; margin-top: 30px; font-weight: bold; color: #00ffcc; }
    </style>
</head>
<body>

    <h1>Dado de Transmisión Mágica</h1>
    <button onclick="conectarDado()">Sincronizar Dispositivo</button>
    
    <div id="estado">Estado: Desconectado</div>
    <div id="resultado">--</div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        let bluetoothDevice = null;
        let miCaracteristica = null;
        let temporizadorInactividadWeb = null;

        async function conectarDado() {
            try {
                document.getElementById('estado').innerText = "Estado: Buscando dispositivo...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'DadoMagicov2' }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                document.getElementById('estado').innerText = "Estado: Vinculando servicios...";
                await iniciarConexionGATT();

            } catch (error) {
                document.getElementById('estado').innerText = "Estado: Desconectado";
            }
        }

        async function iniciarConexionGATT() {
            if (!bluetoothDevice) return;
            
            try {
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                miCaracteristica = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('estado').innerText = "Estado: ¡CONECTADO Y LISTO!";
                document.getElementById('resultado').innerText = "0";

                await miCaracteristica.startNotifications();
                
                // Inicializamos el vigilante de tiempo para la web
                resetearTemporizadorInactividad();

                miCaracteristica.addEventListener('characteristicvaluechanged', (event) => {
                    let value = event.target.value;
                    let caraDetectada = value.getUint8(0);
                    
                    document.getElementById('resultado').innerText = caraDetectada;
                    
                    // Cada vez que llega una cara válida, confirmamos que el dado sigue vivo
                    resetearTemporizadorInactividad();
                    
                    ejecutarDoblePatron(caraDetectada);
                });

            } catch (error) {
                console.log("Error en sincronización GATT.");
                onDisconnected(); // Si falla el canal, forzamos el modo de espera limpia
            }
        }

        // LÓGICA DE DETECCIÓN WEB: Si el dado entra en Modo Fantasma a los 30 segundos,
        // la web lo nota por falta de datos, se limpia sola y se pone a escanear en silencio.
        function resetearTemporizadorInactividad() {
            clearTimeout(temporizadorInactividadWeb);
            // Si el dado pasa 35 segundos sin enviar nada (5 segundos de tolerancia tras tu límite de 30s)
            temporizadorInactividadWeb = setTimeout(() => {
                console.log("Falta de datos detectada. Forzando reconexión silenciosa...");
                onDisconnected();
            }, 35000); 
        }

        function onDisconnected() {
            clearTimeout(temporizadorInactividadWeb);
            document.getElementById('estado').innerText = "Estado: Dado en reposo. Esperando giro...";
            document.getElementById('resultado').innerText = "--";
            
            // Ciclo de reenganche automático: se queda escuchando el aire de fondo en tu bolsillo
            setTimeout(function() {
                if(bluetoothDevice && !bluetoothDevice.gatt.connected) {
                    iniciarConexionGATT();
                }
            }, 2000); 
        }

        function ejecutarDoblePatron(cara) {
            if (!("vibrate" in navigator) || cara === 0) return;

            let patronIndividual = [];
            for (let i = 0; i < cara; i++) {
                patronIndividual.push(200); 
                if (i < cara - 1) {
                    patronIndividual.push(250); 
                }
            }
            let patronCompleto = [...patronIndividual, 1200, ...patronIndividual];
            navigator.vibrate(patronCompleto);
        }
    </script>
</body>
</html>
