<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador Dado Mágico</title>
    <style>
        /* CORRECCIÓN VISUAL: Fondo oscuro pero texto blanco brillante y grande para verlo bien */
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:active { background: #0056b3; }
        #estado { font-size: 20px; margin-top: 20px; color: #aaa; }
        #resultado { font-size: 100px; margin-top: 30px; font-weight: bold; color: #00ffcc; }
    </style>
</head>
<body>

    <h1>Dado de Transmisión Mágica</h1>
    <button onclick="conectarDado()">Sincronizar Dispositivo</button>
    
    <!-- Sección de mensajes en tiempo real -->
    <div id="estado">Estado: Desconectado</div>
    <div id="resultado">--</div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        let bluetoothDevice = null;

        async function conectarDado() {
            try {
                document.getElementById('estado').innerText = "Estado: Buscando dispositivo...";
                
                // Solicita buscar el dado en el entorno Bluetooth
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'DadoMagicov2' }],
                    optionalServices: [SERVICE_UUID]
                });

                // Escucha si el dado se desconecta por inactividad
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                document.getElementById('estado').innerText = "Estado: Vinculando servicios...";
                await iniciarConexionGATT();

            } catch (error) {
                document.getElementById('estado').innerText = "Estado: Error de escaneo";
                alert("Error al seleccionar: " + error);
            }
        }

        async function iniciarConexionGATT() {
            if (!bluetoothDevice) return;
            
            try {
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('estado').innerText = "Estado: ¡CONECTADO Y LISTO!";
                document.getElementById('resultado').innerText = "0";

                // Activa las notificaciones automáticas del chip
                await characteristic.startNotifications();
                
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    let value = event.target.value;
                    let caraDetectada = value.getUint8(0);
                    
                    // Actualiza el número gigante en la pantalla en tiempo real
                    document.getElementById('resultado').innerText = caraDetectada;
                    
                    // Ejecuta el truco de la vibración doble en tu bolsillo
                    ejecutarDoblePatron(caraDetectada);
                });

            } catch (error) {
                document.getElementById('estado').innerText = "Estado: Error GATT de sincronización";
                alert("Fallo en la conexión interna del dado: " + error);
            }
        }

        // Si el dado entra en reposo (Deep Sleep) tras los 3 minutos quieto
        function onDisconnected() {
            document.getElementById('estado').innerText = "Estado: Dado dormido. Esperando doble toque...";
            document.getElementById('resultado').innerText = "--";
            
            // Intenta reengancharse automáticamente cada 2 segundos en segundo plano
            setTimeout(function() {
                iniciarConexionGATT();
            }, 2000); 
        }

        // LÓGICA DEL TRUCO: Genera el patrón, hace una pausa larga, y lo repite una segunda vez
        function ejecutarDoblePatron(cara) {
            if (!("vibrate" in navigator)) return;

            let patronIndividual = [];
            for (let i = 0; i < cara; i++) {
                patronIndividual.push(200); // Cada pulso de vibración dura 200ms
                if (i < cara - 1) {
                    patronIndividual.push(250); // Pausa corta de 250ms entre pulsos
                }
            }

            // Une el patrón dos veces separándolo por una pausa larga de 1.2 segundos (1200ms)
            let patronCompleto = [...patronIndividual, 1200, ...patronIndividual];
            
            navigator.vibrate(patronCompleto);
        }
    </script>
</body>
</html>
