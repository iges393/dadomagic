<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador Secreto</title>
    <style>
        /* Fondo completamente negro e invisible por si alguien ve de reojo tu teléfono */
        body { font-family: Arial, sans-serif; text-align: center; background: #000; color: #111; padding-top: 100px; }
        button { padding: 15px 30px; font-size: 16px; background: #111; color: #222; border: 1px solid #222; border-radius: 5px; cursor: pointer; }
        #resultado { font-size: 20px; margin-top: 40px; color: #111; }
    </style>
</head>
<body>

    <button onclick="conectarDado()">Sincronizar Dispositivo</button>
    <div id="resultado">--</div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        let bluetoothDevice = null;

        async function conectarDado() {
            try {
                // Solicita el emparejamiento manual requerido por seguridad de Chrome
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'DadoMagicov2' }],
                    optionalServices: [SERVICE_UUID]
                });

                // Escucha si el dado se desconecta (por ejemplo, al entrar en Deep Sleep)
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                await iniciarConexionGATT();

            } catch (error) {
                alert("Error: " + error);
            }
        }

        async function iniciarConexionGATT() {
            if (!bluetoothDevice) return;
            
            try {
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await characteristic.startNotifications();
                
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    let value = event.target.value;
                    let caraDetectada = value.getUint8(0);
                    
                    // EJECUTA EL TRUCO: Doble patrón de vibración consecutiva
                    ejecutarDoblePatron(caraDetectada);
                });

                console.log("Dado Vinculado Exitosamente.");
            } catch (error) {
                console.log("Fallo en la conexión GATT: " + error);
            }
        }

        // RECONEXIÓN AUTOMÁTICA: Si el dado se durmió y lo despiertas con el Doble Toque,
        // la web se vuelve a amarrar sola en tu bolsillo sin tocar la pantalla.
        function onDisconnected() {
            console.log("El dado se ha dormido. Intentando reconexión automática de fondo...");
            setTimeout(function() {
                iniciarConexionGATT();
            }, 2000); // Intenta reengancharse cada 2 segundos de forma silenciosa
        }

        // LÓGICA DEL TRUCO: Genera el patrón, hace una pausa larga, y lo repite una segunda vez
        function ejecutarDoblePatron(cara) {
            if (!("vibrate" in navigator)) return;

            let patronIndividual = [];
            for (let i = 0; i < cara; i++) {
                patronIndividual.push(200); // Vibra 200ms
                if (i < cara - 1) {
                    patronIndividual.push(250); // Pausa corta de 250ms entre pulsos
                }
            }

            // Unimos el patrón dos veces separándolo por una pausa larga de 1.2 segundos (1200ms)
            // Ejemplo Cara 2: [200, 250, 200] + [1200] + [200, 250, 200]
            let patronCompleto = [...patronIndividual, 1200, ...patronIndividual];
            
            navigator.vibrate(patronCompleto);
        }
    </script>
</body>
</html>
